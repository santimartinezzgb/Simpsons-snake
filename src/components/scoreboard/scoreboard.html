<header class="hud apple-hud simpson-hud">
    <!-- Personaje activo (sin foto) -->
    <div class="hud-character" id="hud-character-badge" title="Personaje activo">
        <span id="hud-char-name">Homer</span>
    </div>

    <div class="hud-divider" aria-hidden="true"></div>

    <div class="hud-item">
        <span class="hud-label"><span class="hud-emoji">🍩</span><span>Rosquillas</span></span>
        <span id="hud-score" class="hud-value">0</span>
    </div>

    <div class="hud-divider" aria-hidden="true"></div>

    <div class="hud-item">
        <span class="hud-label"><span class="hud-emoji">⏱️</span><span>Tiempo</span></span>
        <span id="hud-time" class="hud-value">00:00</span>
    </div>

    <div class="hud-divider" aria-hidden="true"></div>

    <div class="hud-item">
        <span class="hud-label"><span class="hud-emoji">🏆</span><span>Récord</span></span>
        <span id="hud-best" class="hud-value">0</span>
    </div>

    <button id="btn-pause" class="icon-btn apple-icon-btn hud-pause-btn" type="button" aria-label="Pausar">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
            <path d="M7 5h3v14H7zM14 5h3v14h-3z" />
        </svg>
    </button>
</header>
